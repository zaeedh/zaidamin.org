<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academic CMS & Editorial Studio | Dr. Zaid Amin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,600&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=3.7">
  <style>
    /* CMS Studio Dedicated Styling */
    body {
      background: #030a14;
      color: #e2e8f0;
      font-family: var(--font-sans);
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }
    .cms-navbar {
      background: rgba(8, 18, 32, 0.95);
      border-bottom: 1px solid rgba(186, 230, 253, 0.12);
      padding: 12px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(14px);
    }
    .cms-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .cms-brand-title {
      font-family: var(--font-cinzel);
      font-size: 1.15rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.04em;
    }
    .cms-brand-badge {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--gold, #d4af37);
      background: rgba(212, 175, 55, 0.12);
      border: 1px solid rgba(212, 175, 55, 0.3);
      padding: 3px 8px;
      border-radius: 999px;
    }
    .cms-nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .cms-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .cms-btn-primary {
      background: linear-gradient(135deg, #d4af37 0%, #b89028 100%);
      color: #030d18;
      box-shadow: 0 4px 12px rgba(212, 175, 55, 0.25);
    }
    .cms-btn-primary:hover {
      filter: brightness(1.12);
      transform: translateY(-1px);
    }
    .cms-btn-cyan {
      background: rgba(56, 189, 248, 0.15);
      border-color: rgba(56, 189, 248, 0.35);
      color: #7dd3fc;
    }
    .cms-btn-cyan:hover {
      background: rgba(56, 189, 248, 0.25);
      color: #ffffff;
    }
    .cms-btn-ghost {
      background: rgba(15, 28, 48, 0.6);
      border-color: rgba(186, 230, 253, 0.12);
      color: #cbd5e1;
    }
    .cms-btn-ghost:hover {
      background: rgba(24, 44, 72, 0.8);
      color: #ffffff;
    }
    .cms-btn-danger {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }
    .cms-btn-danger:hover {
      background: rgba(239, 68, 68, 0.28);
    }

    /* Main Layout */
    .cms-main {
      padding: 24px 28px;
      max-width: 1540px;
      margin: 0 auto;
    }
    
    /* View Toggle */
    .cms-tabs-bar {
      display: flex;
      gap: 10px;
      border-bottom: 1px solid rgba(186, 230, 253, 0.1);
      padding-bottom: 14px;
      margin-bottom: 24px;
    }
    .cms-tab-btn {
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      color: #94a3b8;
      background: transparent;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .cms-tab-btn.active {
      color: #ffffff;
      background: rgba(18, 36, 62, 0.8);
      border-color: rgba(212, 175, 55, 0.35);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    /* List View */
    .cms-list-view {
      display: block;
    }
    .cms-filter-row {
      display: flex;
      gap: 14px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .cms-search-box {
      flex: 1;
      min-width: 280px;
      position: relative;
    }
    .cms-input {
      width: 100%;
      background: rgba(10, 22, 38, 0.7);
      border: 1px solid rgba(186, 230, 253, 0.15);
      border-radius: 8px;
      padding: 10px 14px;
      color: #ffffff;
      font-size: 0.9rem;
      outline: none;
      box-sizing: border-box;
      transition: border-color 0.2s ease;
    }
    .cms-input:focus {
      border-color: var(--gold, #d4af37);
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
    }
    .cms-select {
      background: rgba(10, 22, 38, 0.7);
      border: 1px solid rgba(186, 230, 253, 0.15);
      border-radius: 8px;
      padding: 10px 14px;
      color: #ffffff;
      font-size: 0.9rem;
      outline: none;
      cursor: pointer;
    }
    .cms-table-card {
      background: rgba(10, 22, 38, 0.65);
      border: 1px solid rgba(186, 230, 253, 0.1);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
    }
    .cms-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }
    .cms-table th {
      text-align: left;
      padding: 14px 18px;
      background: rgba(14, 28, 48, 0.85);
      color: #bae6fd;
      font-weight: 600;
      border-bottom: 1px solid rgba(186, 230, 253, 0.12);
      font-family: var(--font-cinzel);
      font-size: 0.82rem;
      letter-spacing: 0.05em;
    }
    .cms-table td {
      padding: 14px 18px;
      border-bottom: 1px solid rgba(186, 230, 253, 0.06);
      vertical-align: middle;
    }
    .cms-table tr:hover td {
      background: rgba(20, 40, 68, 0.4);
    }
    .cms-badge-cat {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 600;
      background: rgba(56, 189, 248, 0.12);
      color: #7dd3fc;
      border: 1px solid rgba(56, 189, 248, 0.25);
      white-space: nowrap;
    }

    /* Editor View */
    .cms-editor-view {
      display: none;
    }
    .cms-form-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    .cms-form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }
    .cms-label {
      font-size: 0.82rem;
      font-weight: 600;
      color: #bae6fd;
      font-family: var(--font-cinzel);
      letter-spacing: 0.04em;
    }
    .cms-split-panes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      height: 650px;
    }
    .cms-pane {
      background: rgba(10, 22, 38, 0.7);
      border: 1px solid rgba(186, 230, 253, 0.12);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .cms-pane-header {
      padding: 10px 16px;
      background: rgba(14, 28, 48, 0.9);
      border-bottom: 1px solid rgba(186, 230, 253, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .cms-toolbar {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }
    .cms-tool-btn {
      background: rgba(20, 38, 64, 0.7);
      border: 1px solid rgba(186, 230, 253, 0.1);
      color: #e2e8f0;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .cms-tool-btn:hover {
      background: rgba(56, 189, 248, 0.25);
      border-color: #38bdf8;
      color: #ffffff;
    }
    .cms-textarea {
      flex: 1;
      width: 100%;
      background: transparent;
      border: none;
      padding: 16px;
      color: #f1f5f9;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.88rem;
      line-height: 1.6;
      resize: none;
      outline: none;
      box-sizing: border-box;
    }
    .cms-preview-body {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
      color: #cbd5e1;
      font-size: 0.96rem;
      line-height: 1.75;
      background: rgba(6, 14, 26, 0.85);
    }
    .cms-preview-body h1, .cms-preview-body h2, .cms-preview-body h3 {
      color: #ffffff;
      font-family: var(--font-cinzel);
      margin-top: 1.4em;
      margin-bottom: 0.5em;
    }
    .cms-preview-body blockquote {
      border-left: 3px solid var(--gold, #d4af37);
      margin: 1.2em 0;
      padding: 10px 18px;
      background: rgba(212, 175, 55, 0.06);
      font-style: italic;
      color: #fef08a;
    }
    .cms-preview-body img {
      max-width: 100%;
      border-radius: 8px;
      border: 1px solid rgba(186, 230, 253, 0.15);
      margin: 14px 0;
    }
    .cms-toast {
      position: fixed;
      bottom: 24px;
      right: 28px;
      padding: 12px 22px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.88rem;
      display: none;
      z-index: 1000;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      animation: toastIn 0.25s ease;
    }
    @keyframes toastIn {
      from { transform: translateY(12px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- Top Navbar -->
  <header class="cms-navbar">
    <div class="cms-brand">
      <span class="cms-brand-title">Dr. Zaid Amin</span>
      <span class="cms-brand-badge">Academic CMS Studio</span>
    </div>
    <div class="cms-nav-actions">
      <button class="cms-btn cms-btn-primary" id="btn-new-article" onclick="openNewArticleEditor()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        <span>+ New Article</span>
      </button>
      <button class="cms-btn cms-btn-cyan" id="btn-deploy-live" onclick="deployLiveSite()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13"></path><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        <span>Publish to zaidamin.org</span>
      </button>
      <a href="articles.html" target="_blank" class="cms-btn cms-btn-ghost">
        <span>Articles Hub &nearr;</span>
      </a>
      <a href="index.html" target="_blank" class="cms-btn cms-btn-ghost">
        <span>Homepage &nearr;</span>
      </a>
    </div>
  </header>

  <!-- Main Container -->
  <main class="cms-main">
    
    <!-- Tab Controls -->
    <div class="cms-tabs-bar">
      <button class="cms-tab-btn active" id="tab-list" onclick="switchView('list')">
        📚 All Articles (<span id="total-articles-count">80</span>)
      </button>
      <button class="cms-tab-btn" id="tab-editor" onclick="switchView('editor')">
        ✏️ Article Editor
      </button>
    </div>

    <!-- 1. Articles List View -->
    <section class="cms-list-view" id="view-list">
      <div class="cms-filter-row">
        <div class="cms-search-box">
          <input type="text" id="search-articles-input" class="cms-input" placeholder="Search 80+ articles by title, category, or keyword..." oninput="filterArticles()">
        </div>
        <select id="filter-category-select" class="cms-select" onchange="filterArticles()">
          <option value="">All Categories (All)</option>
          <option value="AI & Cybernetics">AI & Cybernetics</option>
          <option value="Digital Ethics & HCI">Digital Ethics & HCI</option>
          <option value="Research & Methodology">Research & Methodology</option>
          <option value="Pedagogy & Education">Pedagogy & Education</option>
          <option value="Philosophy & Society">Philosophy & Society</option>
          <option value="Epistemic & Media">Epistemic & Media</option>
          <option value="Essays & Perspectives">Essays & Perspectives</option>
        </select>
        <button class="cms-btn cms-btn-ghost" onclick="downloadArticlesJSON()" title="Download a complete JSON backup of all articles">
          📥 Backup JSON
        </button>
      </div>

      <div class="cms-table-card">
        <table class="cms-table" id="articles-table">
          <thead>
            <tr>
              <th style="width: 50px;">#</th>
              <th>Article Title</th>
              <th>Category</th>
              <th>Date</th>
              <th>Read Time</th>
              <th style="text-align: right;">Actions</th>
            </tr>
          </thead>
          <tbody id="articles-table-body">
            <!-- Dynamically populated -->
          </tbody>
        </table>
      </div>
    </section>

    <!-- 2. Dual-Pane Article Editor View -->
    <section class="cms-editor-view" id="view-editor">
      <div class="cms-form-grid">
        <div>
          <div class="cms-form-group">
            <label class="cms-label">Article Title *</label>
            <input type="text" id="form-title" class="cms-input" placeholder="e.g. Cognitive Alignment in Multi-Agent Autonomous Systems" oninput="autoGenerateSlugAndPreview()">
          </div>
          <div class="cms-form-group">
            <label class="cms-label">Article Slug (URL identifier) *</label>
            <input type="text" id="form-slug" class="cms-input" placeholder="e.g. cognitive-alignment-multi-agent-systems">
          </div>
          <div class="cms-form-group">
            <label class="cms-label">Excerpt / Summary (Shown on search cards & social share)</label>
            <textarea id="form-excerpt" class="cms-input" rows="2" placeholder="Brief 1-2 sentence executive abstract..."></textarea>
          </div>
        </div>

        <div>
          <div class="cms-form-group">
            <label class="cms-label">Primary Category *</label>
            <select id="form-category" class="cms-select" style="width: 100%;" onchange="autoGenerateSlugAndPreview()">
              <option value="AI & Cybernetics">AI & Cybernetics</option>
              <option value="Digital Ethics & HCI">Digital Ethics & HCI</option>
              <option value="Research & Methodology">Research & Methodology</option>
              <option value="Pedagogy & Education">Pedagogy & Education</option>
              <option value="Philosophy & Society">Philosophy & Society</option>
              <option value="Epistemic & Media">Epistemic & Media</option>
              <option value="Essays & Perspectives">Essays & Perspectives</option>
              <option value="__custom__">+ Enter Custom Category...</option>
            </select>
            <input type="text" id="form-custom-category" class="cms-input" placeholder="Type new category..." style="display: none; margin-top: 6px;">
          </div>
          <div class="cms-form-group">
            <label class="cms-label">Tags (comma-separated)</label>
            <input type="text" id="form-tags" class="cms-input" placeholder="e.g. AI Governance, Cybernetics, MDPI">
          </div>
          <div class="cms-form-group">
            <label class="cms-label">Publication Date</label>
            <input type="date" id="form-date" class="cms-input">
          </div>
          <div class="cms-form-group">
            <label class="cms-label">Hero Image URL (optional)</label>
            <input type="text" id="form-image" class="cms-input" placeholder="https://... or assets/images/...">
          </div>
        </div>
      </div>

      <!-- Split Screen Content Editor & Live Preview -->
      <div class="cms-split-panes">
        <!-- Left: Editor Pane -->
        <div class="cms-pane">
          <div class="cms-pane-header">
            <div class="cms-toolbar">
              <button class="cms-tool-btn" onclick="insertFormat('h2')">H2</button>
              <button class="cms-tool-btn" onclick="insertFormat('h3')">H3</button>
              <button class="cms-tool-btn" onclick="insertFormat('bold')"><b>B</b></button>
              <button class="cms-tool-btn" onclick="insertFormat('italic')"><i>I</i></button>
              <button class="cms-tool-btn" onclick="insertFormat('quote')">Quote</button>
              <button class="cms-tool-btn" onclick="insertFormat('code')">Code</button>
              <button class="cms-tool-btn" onclick="insertFormat('ul')">• List</button>
              <button class="cms-tool-btn" onclick="insertFormat('link')">Link</button>
              <button class="cms-tool-btn" onclick="insertFormat('img')">Img</button>
              <button class="cms-tool-btn" onclick="insertFormat('hr')">HR</button>
            </div>
            <span style="font-size: 0.75rem; color: #94a3b8; font-family: monospace;" id="word-count-badge">0 words &bull; 1 min read</span>
          </div>
          <textarea id="form-content" class="cms-textarea" placeholder="Write or paste your article content in Markdown or HTML..." oninput="autoGenerateSlugAndPreview()"></textarea>
        </div>

        <!-- Right: Live Golden Ratio Preview Pane -->
        <div class="cms-pane">
          <div class="cms-pane-header">
            <span style="font-family: var(--font-cinzel); font-size: 0.8rem; color: #bae6fd; font-weight: 600;">LIVE GOLDEN RATIO PREVIEW</span>
            <span class="cms-badge-cat" id="preview-category-badge">AI & Cybernetics</span>
          </div>
          <div class="cms-preview-body" id="preview-pane-body">
            <h1 id="preview-title" style="margin-top: 0;">Article Title Preview</h1>
            <div style="font-size: 0.8rem; color: #94a3b8; margin-bottom: 18px;" id="preview-meta">
              By Dr. Zaid Amin &bull; <span id="preview-date">Today</span> &bull; <span id="preview-reading-time">1 min read</span>
            </div>
            <div id="preview-content-rendered">
              Start typing on the left to see your live editorial preview...
            </div>
          </div>
        </div>
      </div>

      <!-- Editor Bottom Actions -->
      <div style="margin-top: 20px; display: flex; justify-content: flex-end; gap: 12px;">
        <button class="cms-btn cms-btn-ghost" onclick="switchView('list')">Cancel</button>
        <button class="cms-btn cms-btn-cyan" onclick="saveCurrentArticle(false)">💾 Save Article</button>
        <button class="cms-btn cms-btn-primary" onclick="saveCurrentArticle(true)">🚀 Save &amp; Publish Live</button>
      </div>
    </section>

  </main>

  <!-- Notification Toast -->
  <div class="cms-toast" id="cms-toast"></div>

  <script>
    let articles = [];
    let currentEditingSlug = null;

    // Toast helper
    function showToast(msg, isError = false) {
      const toast = document.getElementById('cms-toast');
      toast.textContent = msg;
      toast.style.background = isError ? '#991b1b' : '#065f46';
      toast.style.color = '#ffffff';
      toast.style.border = isError ? '1px solid #ef4444' : '1px solid #10b981';
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 4000);
    }

    // Load articles on start
    async function loadArticles() {
      try {
        const res = await fetch('data/articles.json?t=' + Date.now());
        if (res.ok) {
          articles = await res.json();
          renderArticlesTable(articles);
          document.getElementById('total-articles-count').textContent = articles.length;
        } else {
          showToast('Could not load data/articles.json', true);
        }
      } catch (err) {
        console.error(err);
        showToast('Error loading articles', true);
      }
    }

    // Render Table
    function renderArticlesTable(items) {
      const tbody = document.getElementById('articles-table-body');
      tbody.innerHTML = '';

      if (items.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 32px; color: #94a3b8;">No articles found.</td></tr>';
        return;
      }

      items.forEach((a, idx) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td style="color: #64748b; font-family: monospace;">${idx + 1}</td>
          <td>
            <strong style="color: #ffffff; display: block; margin-bottom: 2px;">${escapeHtml(a.title)}</strong>
            <span style="font-size: 0.75rem; color: #94a3b8; font-family: monospace;">ID: ${a.id}</span>
          </td>
          <td><span class="cms-badge-cat">${escapeHtml(a.category || 'General')}</span></td>
          <td style="color: #cbd5e1; font-family: monospace; font-size: 0.82rem;">${a.date}</td>
          <td style="color: #94a3b8; font-size: 0.82rem;">${a.reading_time || '3 min read'}</td>
          <td style="text-align: right; white-space: nowrap;">
            <a href="article.html?id=${encodeURIComponent(a.id)}" target="_blank" class="cms-tool-btn" style="text-decoration: none; display: inline-block;">View &nearr;</a>
            <button class="cms-tool-btn" onclick="editArticle('${a.id}')">Edit</button>
            <button class="cms-tool-btn" style="color: #fca5a5;" onclick="deleteArticlePrompt('${a.id}')">&times;</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // Filter
    function filterArticles() {
      const query = document.getElementById('search-articles-input').value.toLowerCase().trim();
      const cat = document.getElementById('filter-category-select').value;

      const filtered = articles.filter(a => {
        const matchesQuery = !query || a.title.toLowerCase().includes(query) || (a.excerpt && a.excerpt.toLowerCase().includes(query)) || a.id.toLowerCase().includes(query);
        const matchesCat = !cat || a.category === cat;
        return matchesQuery && matchesCat;
      });

      renderArticlesTable(filtered);
    }

    // View Switcher
    function switchView(view) {
      if (view === 'list') {
        document.getElementById('view-list').style.display = 'block';
        document.getElementById('view-editor').style.display = 'none';
        document.getElementById('tab-list').classList.add('active');
        document.getElementById('tab-editor').classList.remove('active');
      } else {
        document.getElementById('view-list').style.display = 'none';
        document.getElementById('view-editor').style.display = 'block';
        document.getElementById('tab-list').classList.remove('active');
        document.getElementById('tab-editor').classList.add('active');
      }
    }

    // Open New Article Editor
    function openNewArticleEditor() {
      currentEditingSlug = null;
      document.getElementById('form-title').value = '';
      document.getElementById('form-slug').value = '';
      document.getElementById('form-excerpt').value = '';
      document.getElementById('form-category').value = 'AI & Cybernetics';
      document.getElementById('form-custom-category').style.display = 'none';
      document.getElementById('form-tags').value = '';
      document.getElementById('form-date').value = new Date().toISOString().slice(0, 10);
      document.getElementById('form-image').value = '';
      document.getElementById('form-content').value = '';
      autoGenerateSlugAndPreview();
      switchView('editor');
    }

    // Edit Existing
    function editArticle(slug) {
      const art = articles.find(a => a.id === slug);
      if (!art) return;
      currentEditingSlug = slug;
      document.getElementById('form-title').value = art.title || '';
      document.getElementById('form-slug').value = art.id || '';
      document.getElementById('form-excerpt').value = art.excerpt || '';
      
      const catSelect = document.getElementById('form-category');
      let found = false;
      for (let opt of catSelect.options) {
        if (opt.value === art.category) {
          catSelect.value = art.category;
          found = true;
          break;
        }
      }
      if (!found && art.category) {
        catSelect.value = '__custom__';
        document.getElementById('form-custom-category').style.display = 'block';
        document.getElementById('form-custom-category').value = art.category;
      } else {
        document.getElementById('form-custom-category').style.display = 'none';
      }

      document.getElementById('form-tags').value = Array.isArray(art.tags) ? art.tags.join(', ') : (art.tags || '');
      document.getElementById('form-date').value = art.date || new Date().toISOString().slice(0, 10);
      document.getElementById('form-image').value = art.image || '';
      document.getElementById('form-content').value = art.content_html || '';
      autoGenerateSlugAndPreview();
      switchView('editor');
    }

    // Auto-generate slug & live preview
    function autoGenerateSlugAndPreview() {
      const title = document.getElementById('form-title').value;
      const slugInput = document.getElementById('form-slug');
      if (!currentEditingSlug && title) {
        slugInput.value = title.toLowerCase().replace(/[^a-z0-9\s-]/g, '').trim().replace(/[-\s]+/g, '-').slice(0, 60);
      }

      const catSelect = document.getElementById('form-category');
      let cat = catSelect.value;
      if (cat === '__custom__') {
        document.getElementById('form-custom-category').style.display = 'block';
        cat = document.getElementById('form-custom-category').value || 'General';
      } else {
        document.getElementById('form-custom-category').style.display = 'none';
      }

      const content = document.getElementById('form-content').value;
      const words = content.replace(/<[^>]+>/g, ' ').trim().split(/\s+/).filter(Boolean).length;
      const readingTime = Math.max(1, Math.round(words / 200)) + ' min read';

      // Update Preview
      document.getElementById('preview-title').textContent = title || 'Article Title Preview';
      document.getElementById('preview-category-badge').textContent = cat;
      document.getElementById('preview-date').textContent = document.getElementById('form-date').value || 'Today';
      document.getElementById('preview-reading-time').textContent = readingTime;
      document.getElementById('word-count-badge').textContent = `${words} words • ${readingTime}`;
      document.getElementById('preview-content-rendered').innerHTML = content || 'Start typing on the left to see your live editorial preview...';
    }

    // Formatting Toolbar Helpers
    function insertFormat(type) {
      const textarea = document.getElementById('form-content');
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      const selText = textarea.value.substring(start, end);
      let replacement = '';

      switch(type) {
        case 'h2': replacement = `\n<h2>${selText || 'Section Heading'}</h2>\n`; break;
        case 'h3': replacement = `\n<h3>${selText || 'Subheading'}</h3>\n`; break;
        case 'bold': replacement = `<strong>${selText || 'Bold Text'}</strong>`; break;
        case 'italic': replacement = `<em>${selText || 'Italic Text'}</em>`; break;
        case 'quote': replacement = `\n<blockquote>${selText || 'Quotation text...'}</blockquote>\n`; break;
        case 'code': replacement = `<code>${selText || 'codeSnippet()'}</code>`; break;
        case 'ul': replacement = `\n<ul>\n  <li>${selText || 'First item'}</li>\n  <li>Second item</li>\n</ul>\n`; break;
        case 'link': replacement = `<a href="https://...">${selText || 'Link text'}</a>`; break;
        case 'img': replacement = `<figure><img src="https://..." alt="Caption"><figcaption>Image caption</figcaption></figure>`; break;
        case 'hr': replacement = `\n<hr class="golden-divider">\n`; break;
      }

      textarea.setRangeText(replacement, start, end, 'end');
      textarea.focus();
      autoGenerateSlugAndPreview();
    }

    // Save Article
    async function saveCurrentArticle(andDeploy = false) {
      const title = document.getElementById('form-title').value.trim();
      const slug = document.getElementById('form-slug').value.trim();
      const content = document.getElementById('form-content').value.trim();

      if (!title || !slug || !content) {
        showToast('Title, slug, and content are required!', true);
        return;
      }

      let category = document.getElementById('form-category').value;
      if (category === '__custom__') {
        category = document.getElementById('form-custom-category').value.trim() || 'General';
      }

      const tags = document.getElementById('form-tags').value.split(',').map(t => t.trim()).filter(Boolean);
      const date = document.getElementById('form-date').value || new Date().toISOString().slice(0, 10);
      const excerpt = document.getElementById('form-excerpt').value.trim() || content.replace(/<[^>]+>/g, ' ').slice(0, 240) + '...';
      const image = document.getElementById('form-image').value.trim();
      const words = content.replace(/<[^>]+>/g, ' ').trim().split(/\s+/).filter(Boolean).length;
      const reading_time = Math.max(1, Math.round(words / 200)) + ' min read';

      const articlePayload = {
        id: slug,
        title: title,
        date: date,
        year: date.slice(0, 4),
        category: category,
        tags: tags.length ? tags : [category],
        reading_time: reading_time,
        excerpt: excerpt,
        image: image,
        content_html: content,
        author: "Dr. Zaid Amin"
      };

      // Check if updating or adding
      const existingIdx = articles.findIndex(a => a.id === (currentEditingSlug || slug));
      if (existingIdx !== -1) {
        articles[existingIdx] = articlePayload;
      } else {
        articles.unshift(articlePayload);
      }

      // Send to local API backend if available
      try {
        const res = await fetch('/api/save-article', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ article: articlePayload, deploy: andDeploy })
        });
        if (res.ok) {
          showToast(andDeploy ? 'Article saved & deploying live to zaidamin.org!' : 'Article saved successfully!');
          renderArticlesTable(articles);
          switchView('list');
          return;
        }
      } catch (e) {
        // Fallback for standalone file open
        console.warn('Backend API not responding, triggering direct JSON download fallback.');
      }

      // If backend API not running, prompt user to download updated JSON
      downloadArticlesJSON();
      showToast('Article updated in memory! Downloaded updated articles.json backup.');
      renderArticlesTable(articles);
      switchView('list');
    }

    // Delete Article
    async function deleteArticlePrompt(slug) {
      if (!confirm(`Are you sure you want to delete article: "${slug}"?`)) return;
      articles = articles.filter(a => a.id !== slug);
      renderArticlesTable(articles);
      document.getElementById('total-articles-count').textContent = articles.length;

      try {
        await fetch('/api/delete-article?id=' + encodeURIComponent(slug), { method: 'POST' });
        showToast('Article deleted.');
      } catch (e) {
        showToast('Article deleted in memory. Remember to save backup JSON.');
      }
    }

    // Deploy Live Site
    async function deployLiveSite() {
      const btn = document.getElementById('btn-deploy-live');
      btn.innerHTML = '⏳ Deploying live...';
      btn.disabled = true;

      try {
        const res = await fetch('/api/deploy', { method: 'POST' });
        if (res.ok) {
          showToast('Live deployment triggered successfully! Live in ~10 seconds.');
        } else {
          showToast('Deploy request sent. Running pipeline.');
        }
      } catch (e) {
        showToast('To deploy: run "deploy.bat" or "python deploy.py" in your terminal.', false);
      } finally {
        setTimeout(() => {
          btn.innerHTML = `
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13"></path><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            <span>Publish to zaidamin.org</span>
          `;
          btn.disabled = false;
        }, 3000);
      }
    }

    // Download JSON Backup
    function downloadArticlesJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(articles, null, 2));
      const a = document.createElement('a');
      a.setAttribute("href", dataStr);
      a.setAttribute("download", "articles.json");
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    window.addEventListener('DOMContentLoaded', loadArticles);
  </script>
</body>
</html>
