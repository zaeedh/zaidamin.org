<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bgGrad10" cx="50%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#102844" />
      <stop offset="100%" stop-color="#061224" />
    </radialGradient>
    <filter id="softGlow10" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Circular Base -->
  <circle cx="200" cy="200" r="198" fill="url(#bgGrad10)" />
  
  <!-- Subtle Hairline Ring -->
  <circle cx="200" cy="200" r="190" fill="none" stroke="rgba(56, 189, 248, 0.45)" stroke-width="2" />
  <circle cx="200" cy="200" r="182" fill="none" stroke="rgba(148, 163, 184, 0.14)" stroke-width="1" stroke-dasharray="6 4" />

  <!-- Academic Monogram Initials -->
  <text x="200" y="210" font-family="'Cinzel', Georgia, serif" font-size="88" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="4" filter="url(#softGlow10)">RJ</text>
  
  <!-- Subtle Accent Dot -->
  <circle cx="200" cy="245" r="4" fill="#38bdf8" />

  <!-- Sample Photo Identifier Pill (Ready for User to Replace) -->
  <g transform="translate(200, 318)">
    <rect x="-95" y="-16" width="190" height="32" rx="16" fill="rgba(4, 12, 24, 0.88)" stroke="rgba(56, 189, 248, 0.45)" stroke-width="1.2" />
    <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1.2">PHOTO #10 • MASTER</text>
  </g>
</svg>